[project]
name = "cv32e40p-specializer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "numpy>=2.4.2",
    "pydantic>=2.0",
    "pyslang>=10.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.0",
    "strands-agents>=1.25.0",
    "strands-agents-tools>=0.2.20",
]

[dependency-groups]
dev = [
    "hypothesis>=6.152.9",
    "mypy>=1.19.1",
    "pre-commit>=4.6.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=analysis --cov=codegen --cov=simulation --cov=report --cov=pipeline --cov=synthesis --cov=core --cov=strategies --cov=targets --cov=workloads --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

# Strict mode is gated to the new packages: every Phase 1+
# module is held to the high bar; the legacy code is left at
# the looser default to avoid scope creep.  Per-module flags
# below are only those that DO accept per-module overrides --
# global-only flags (warn_redundant_casts, etc.) are set above.
[[tool.mypy.overrides]]
module = ["core.*", "strategies.*", "targets.*", "workloads.*"]
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "pyslang.*"
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    # Vendored upstream cv32e40p files; we don't lint third-party
    # code that lives inside the target package.
    "targets/cv32e40p/ci/",
    "targets/cv32e40p/docs/",
    "targets/cv32e40p/util/",
    "targets/cv32e40p/scripts/",
    "targets/cv32e40p/rtl/",
    "targets/cv32e40p/example_tb/",
    "targets/cv32e40p/bhv/",
    "targets/cv32e40p/sva/",
    # Build artifacts and fixtures.
    "output/",
    ".venv/",
    "build/",
]

[tool.ruff.lint]
# Default: pycodestyle (E/W), pyflakes (F), isort (I).  Phase 4.1
# adds:
#   B    flake8-bugbear (likely-buggy patterns)
#   UP   pyupgrade (auto-modernise syntax)
#   SIM  flake8-simplify (legibility)
#   RUF  ruff's own native rules
# The selected set is a deliberate subset of the "industry baseline"
# -- enough to catch real defects without churning legacy code on
# every commit.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # Module-level `from __future__ import annotations` is fine.
    "UP007",  # Use `X | Y` -- we keep Optional for clarity in stubs.
    "B008",   # Do not perform function calls in argument defaults.
    "SIM117", # Use a single `with` -- `contextlib.redirect_stdout`
              # nests we keep readable on purpose.
]

[tool.ruff.lint.per-file-ignores]
"report/html_report.py" = ["E501"]  # HTML template strings are inherently long
"main.py" = ["E501", "SIM108"]  # legacy CLI module; we only added --log-level here
"tests/**/*.py" = [
    "B011",   # `assert False` is fine in tests
    "B017",   # `pytest.raises(Exception)` is fine for "any error" contracts
]
"examples/**/*.py" = ["E501"]  # Long log lines are fine in scripts
# The new packages have a documented "soft-skip" policy for
# rendering errors (see passes.py docstring).  ``contextlib.suppress``
# is functionally equivalent but harder to evolve when we want to
# add structured logging in Phase 4.2; we keep the explicit form.
"core/pipeline.py" = ["SIM105"]
"targets/cv32e40p/passes.py" = ["SIM105"]
"targets/cv32e40p/patches.py" = ["SIM105"]
"targets/cv32e40p/portability_shim.py" = ["SIM105"]

[tool.coverage.run]
source = ["analysis", "codegen", "simulation", "report", "pipeline", "synthesis", "core", "strategies", "targets", "workloads"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ ==",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
